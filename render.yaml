services:
  - type: web
    name: rust-carteira-investimentos
    env: docker
    plan: free
    repo: https://github.com/pedrohpsantos/rust-fullstack-carteira-investimentos.git
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carteira-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SQLX_OFFLINE
        value: true

databases:
  - name: carteira-db
    plan: free
