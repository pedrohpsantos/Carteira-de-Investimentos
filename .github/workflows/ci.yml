name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  # ==========================================
  # BACKEND PIPELINE
  # ==========================================
  lint-back:
    name: Lint Back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy -- -D warnings

  build-back:
    name: Build Back
    runs-on: ubuntu-latest
    needs: lint-back
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build Backend
        run: cargo build --release

  test-back:
    name: Test Back
    runs-on: ubuntu-latest
    needs: build-back
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres
      - name: Run Migrations
        run: sqlx migrate run
      - name: Run Backend Tests
        run: cargo test

  deploy-back:
    name: Deploy Back
    runs-on: ubuntu-latest
    needs: test-back
    steps:
      - name: Deploy Backend
        run: echo "Deploying Backend to Render..."

  # ==========================================
  # FRONTEND PIPELINE
  # ==========================================
  lint-front:
    name: Lint Front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint HTML Templates
        run: npm run lint

  test-front:
    name: Test Front
    runs-on: ubuntu-latest
    needs: lint-front
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Set up Rust (for webServer)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres
      - name: Run Migrations
        run: sqlx migrate run
      - name: Run E2E Tests
        run: npm run test

  build-front:
    name: Build Front
    runs-on: ubuntu-latest
    needs: test-front
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          echo "Compiling frontend assets (Askama SSR)..."
          echo "Frontend Build OK!"

  deploy-front:
    name: Deploy Front
    runs-on: ubuntu-latest
    needs: build-front
    steps:
      - name: Deploy Frontend
        run: echo "Deploying Frontend assets..."
